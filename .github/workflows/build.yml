name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Locate project
        run: |
          ls -la
          if [ -f FloatingControls.zip ]; then
            unzip -q -o FloatingControls.zip -d _unpacked
            echo "DIR=_unpacked/FloatingControls" >> $GITHUB_ENV
          else
            echo "DIR=." >> $GITHUB_ENV
          fi
      - name: Build debug APK
        run: |
          set +e
          gradle -p "$DIR" assembleDebug --console=plain > build.log 2>&1
          code=$?
          grep -E "^e: |What went wrong|Execution failed|error:|not found" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          tail -n 25 build.log
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingControls-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
