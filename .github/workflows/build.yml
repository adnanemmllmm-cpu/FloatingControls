name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Locate project
        run: |
          echo "Files in repo root:"; ls -la
          Z=$(ls -t *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$Z" ]; then
            echo "Using zip: $Z"
            unzip -q -o "$Z" -d _unpacked
            S=$(find _unpacked -name settings.gradle.kts | head -n1)
          else
            S=$(find . -name settings.gradle.kts | head -n1)
          fi
          if [ -z "$S" ]; then
            echo "::error::No settings.gradle.kts found. Upload FloatingControls.zip to the repo root."
            exit 1
          fi
          echo "DIR=$(dirname "$S")" >> $GITHUB_ENV
      - name: Build debug APK
        run: |
          set +e
          gradle -p "$DIR" assembleDebug --console=plain > build.log 2>&1
          code=$?
          grep -E "^e: |What went wrong|Execution failed|error:|not found" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          tail -n 25 build.log
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingControls-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
