herename: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Locate project (supports uploading FloatingControls.zip only)
        run: |
          if [ -f FloatingControls.zip ]; then
            unzip -q -o FloatingControls.zip -d _unpacked
            echo "DIR=_unpacked/FloatingControls" >> $GITHUB_ENV
          else
            echo "DIR=." >> $GITHUB_ENV
          fi
      - name: Build debug APK
        run: gradle -p "$DIR" assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingControls-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
